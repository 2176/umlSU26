name: calculator ci

on:
  workflow_dispatch:
  push:
   
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Run unit tests
        working-directory: week10/calculator
        run: ./gradlew test

  build-and-test:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the calculator image
        run: docker build -t calculator:gha-${{ github.run_number }} week10/calculator

      - name: Start the container
        run: docker run -d --name calc-gha -p 18090:8080 calculator:gha-${{ github.run_number }}

      - name: Acceptance test
        run: |
          for i in $(seq 1 20); do
            answer=$(curl -s "http://localhost:18090/sum?a=1&b=2" || true)
            if [ "$answer" = "3" ]; then
              echo "PASS /sum = $answer"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL"
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f calc-gha
